<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7efe6">
    <meta name="description" content="Recomeço: acompanhamento diário para reduzir danos e construir sobriedade.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <title>Recomeço</title>
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <header class="status-bar" aria-hidden="true">
        <span>10:24</span>
        <span class="status-icons"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span>
      </header>
      <main id="app" class="app-main" aria-live="polite"></main>
      <nav id="bottom-nav" class="bottom-nav" aria-label="Navegação principal">
        <button data-route="inicio" aria-label="Início"><span data-nav-icon="home"></span><small>Início</small></button>
        <button data-route="caminho" aria-label="Meu caminho"><span data-nav-icon="chart"></span><small>Meu caminho</small></button>
        <button data-route="registrar" aria-label="Registrar"><span data-nav-icon="plus"></span><small>Registrar</small></button>
        <button data-route="apoio" aria-label="Apoio"><span data-nav-icon="book"></span><small>Apoio</small></button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
