<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c5a47"><title>Recomeço · cuidado diário</title><style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#123d35;--muted:#70807a;--green:#0b5a46;--green2:#1f7e5c;--mint:#dff0e7;--lime:#dce89b;--peach:#f8d9c9;--lav:#e9def3;--line:#dce6df;--shadow:0 14px 32px #123d3512;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#e2f0e6,transparent 32%),var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer;border:0}a{color:inherit;text-decoration:none}.app{width:min(100%,760px);margin:auto;min-height:100vh;padding-bottom:88px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#f7f3eadd;backdrop-filter:blur(15px);border-bottom:1px solid #123d3510}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;letter-spacing:-.04em}.brandmark{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;background:var(--green);color:#fff}.top-actions{display:flex;gap:8px}.round{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--green);font-weight:900}.screen{padding:30px 20px}.hero{display:flex;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{margin:0 0 9px;color:var(--green2);font-size:11px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.hero h1{margin:0 0 10px;font:700 clamp(36px,9vw,54px)/.95 Georgia,serif;letter-spacing:-.06em}.hero p{max-width:470px;margin:0;color:var(--muted);font-size:15px;line-height:1.48}.orb{width:78px;height:78px;flex:0 0 78px;border-radius:28px 48px 28px 48px;background:var(--lime);transform:rotate(12deg);display:grid;place-items:center;font-size:28px;color:var(--green)}.counter{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:20px;border-radius:24px;background:var(--green);color:white;box-shadow:var(--shadow);margin-bottom:17px}.counter h2{margin:0 0 5px;font:700 31px/1 Georgia,serif}.counter p{margin:0;color:#c9e9db;font-size:12px}.counter strong{font-size:48px;letter-spacing:-.07em}.counter strong small{display:block;text-align:right;color:#c9e9db;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.stat{padding:15px;border-radius:18px}.stat b{display:block;margin:6px 0 0;font-size:23px}.stat small{font-size:11px;font-weight:800}.stat.green{background:var(--mint)}.stat.peach{background:var(--peach)}.card{padding:18px;border-radius:22px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:20px}.card h2{margin:0 0 8px;font:700 27px/1 Georgia,serif;letter-spacing:-.04em}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.advice{padding:18px;border-radius:19px;background:var(--lav);margin:14px 0}.advice p{font:700 21px/1.18 Georgia,serif;color:var(--ink)}.primary{display:flex;justify-content:center;align-items:center;width:100%;padding:15px 18px;border-radius:15px;background:var(--green);color:white;font-weight:900}.secondary{display:flex;justify-content:center;align-items:center;width:100%;padding:13px 16px;border-radius:15px;background:var(--paper);color:var(--green);border:1px solid var(--line);font-weight:900}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 13px}.section-head h2{margin:0;font:700 25px Georgia,serif}.section-head a{font-size:11px;font-weight:900;color:var(--green2)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick button{min-height:122px;padding:15px;border-radius:19px;text-align:left}.quick strong{display:block;margin-top:15px;font-size:15px}.quick small{display:block;margin-top:5px;color:#123d35b6;font-size:11px;line-height:1.35}.q1{background:var(--peach)}.q2{background:var(--lav)}.q3{background:var(--mint)}.q4{background:var(--lime)}.safety{display:flex;gap:10px;margin-top:22px;padding:15px;border-radius:17px;background:#fff1e9;color:#6f5144;font-size:12px;line-height:1.45}.safety b{color:#b76548;font-size:17px}.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0}.mood button{display:grid;gap:5px;place-items:center;padding:10px 2px;border-radius:14px;background:#f2f4ef;color:var(--muted);font-size:21px}.mood button small{font-size:9px;font-weight:900}.mood button.selected{outline:2px solid var(--green2);background:var(--mint);color:var(--green)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:15px;background:#edf0e8;margin:16px 0}.tabs button{padding:11px;border-radius:11px;background:transparent;color:var(--muted);font-size:12px;font-weight:900}.tabs button.active{background:var(--green);color:#fff}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.option{display:grid;gap:6px;place-items:center;min-height:77px;padding:8px 4px;border-radius:14px;background:#fbfaf5;border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:800;text-align:center}.option i{font-style:normal;font-size:22px}.option.selected{background:var(--mint);border-color:var(--green2);box-shadow:inset 0 0 0 2px var(--green2)}.qty{display:flex;justify-content:space-between;align-items:center;margin:15px 0;padding:12px 14px;border-radius:14px;background:#f0f4eb}.qty span{color:var(--muted);font-size:12px}.qty strong{font-size:18px}.qty button{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--green);font-weight:900}.history{display:grid;gap:9px}.history-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}.history-row strong{display:block;font-size:13px}.history-row small{color:var(--muted);font-size:11px}.history-row b{color:var(--green2)}.bottom{position:fixed;left:50%;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,760px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fffdf8ee;backdrop-filter:blur(15px);border-top:1px solid var(--line)}.bottom a{display:grid;justify-items:center;gap:4px;color:#81908a;font-size:18px}.bottom a.active{color:var(--green)}.bottom small{font-size:10px;font-weight:900}.back{display:inline-flex;margin-bottom:18px;color:var(--green2);font-size:12px;font-weight:900}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.metric{padding:12px;border-radius:15px;background:var(--mint)}.metric b{display:block;font-size:23px}.metric small{color:var(--muted);font-size:10px}.bar{height:8px;border-radius:99px;background:#e6eee7;overflow:hidden}.bar b{display:block;height:100%;width:68%;background:var(--green2);border-radius:inherit}.toast{position:fixed;left:18px;right:18px;bottom:83px;z-index:20;padding:13px;border-radius:13px;background:var(--green);color:#fff;text-align:center;font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateY(0)}@media(min-width:620px){.screen{padding:38px 32px}.quick{grid-template-columns:repeat(4,1fr)}.options{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header class="top"><a class="brand" href="#inicio"><span class="brandmark">↗</span>recomeço</a><div class="top-actions"><button class="round" data-action="privacy">⌁</button><button class="round">M</button></div></header><main id="view"></main><nav class="bottom"><a href="#inicio" data-nav="inicio">⌂<small>Início</small></a><a href="#registrar" data-nav="registrar">⊕<small>Registrar</small></a><a href="#caminho" data-nav="caminho">↗<small>Meu caminho</small></a><a href="#apoio" data-nav="apoio">▤<small>Apoio</small></a></nav></div><div class="toast" id="toast"></div><script>
const V=document.querySelector('#view'),T=document.querySelector('#toast');let d=JSON.parse(localStorage.getItem('recomeco-v2')||'{}');d.start=d.start||new Date().toISOString();d.records=d.records||[];d.mood=d.mood||null;function save(){localStorage.setItem('recomeco-v2',JSON.stringify(d))}function days(){return Math.max(1,Math.floor((Date.now()-new Date(d.start))/86400000)+1)}function toast(t){T.textContent=t;T.classList.add('show');setTimeout(()=>T.classList.remove('show'),2300)}function nav(a){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===a))}
const moods=[['😣','pesado'],['😕','baixo'],['😐','neutro'],['🙂','bem'],['✨','leve']];const drinks=[['🍺','Cerveja'],['🍻','Chopp'],['🍷','Vinho tinto'],['🥂','Vinho branco'],['🍾','Espumante'],['🍸','Vodka'],['🥃','Whisky'],['🟨','Cachaça'],['🍹','Rum'],['🍸','Gin'],['🟧','Tequila'],['🍷','Licor'],['🍹','Drinks'],['•••','Outra bebida']];const drugs=[['🌿','Cannabis'],['◇','Cocaína'],['◆','Crack'],['💊','MDMA / ecstasy'],['⚡','Anfetaminas'],['✦','Metanfetamina'],['◯','Opioides'],['◇','Heroína'],['◌','Benzodiazepínicos'],['◍','Inalantes'],['▰','Tabaco'],['•••','Outra substância']];let tab='drinks',chosen=null,qty=1;
function home(){nav('inicio');V.innerHTML=`<section class="screen"><div class="hero"><div><p class="eyebrow">BOM TE VER AQUI, MÔNICA</p><h1>Um dia de cada vez.</h1><p>Seu espaço privado para acompanhar a recuperação com mais cuidado e menos culpa.</p></div><div class="orb">✦</div></div><div class="counter"><div><h2>Você está em movimento.</h2><p>Conte os dias, celebre os passos e recomece quando precisar.</p></div><strong>${days()}<small>dias</small></strong></div><div class="stats"><div class="stat green"><small>Recorde sóbrio</small><b>${Math.max(87,days())} dias</b></div><div class="stat peach"><small>Marco de saúde</small><b>${Math.min(30,days())} dias</b></div></div><div class="card"><h2>Conselho do dia</h2><div class="advice"><p>“Você não precisa decidir tudo agora. Escolha o próximo minuto.”</p></div><button class="primary" data-go="registrar">✎ Registrar consumo</button></div><div class="section-head"><h2>Para este momento</h2><a href="#apoio">ver tudo →</a></div><div class="quick"><button class="q1" data-go="fissura"><span>〰</span><strong>Estou com fissura</strong><small>Um plano de 3 minutos para atravessar a onda.</small></button><button class="q2" data-go="checkin"><span>◌</span><strong>Fazer check-in</strong><small>Nomeie o que está acontecendo sem julgamento.</small></button><button class="q3" data-go="apoio"><span>✦</span><strong>Usar um apoio</strong><small>Perguntas e estratégias para hoje.</small></button><button class="q4" data-go="caminho"><span>↗</span><strong>Ver meu progresso</strong><small>Pequenas vitórias também contam.</small></button></div><div class="safety"><b>!</b><span>Se houver risco de overdose, abstinência grave ou perigo imediato, ligue <strong>192</strong> ou procure uma emergência.</span></div></section>`}
function register(){nav('registrar');const list=tab==='drinks'?drinks:drugs;V.innerHTML=`<section class="screen"><a class="back" href="#inicio">← voltar ao início</a><div class="card"><p class="eyebrow">REGISTRO PRIVADO</p><h2>Registrar consumo</h2><div class="tabs"><button class="${tab==='drinks'?'active':''}" data-tab="drinks">Bebidas alcoólicas</button><button class="${tab==='drugs'?'active':''}" data-tab="drugs">Outras drogas</button></div><h3>${tab==='drinks'?'Qual bebida você bebeu?':'O que você usou?'}</h3><div class="options">${list.map((x,i)=>`<button class="option ${chosen===i?'selected':''}" data-opt="${i}"><i>${x[0]}</i>${x[1]}</button>`).join('')}</div>${tab==='drinks'?`<div class="qty"><span>Quantidade<br><small>Dose / lata / taça</small></span><div><button data-qty="-">−</button> <strong>${qty}</strong> <button data-qty="+">+</button></div></div>`:`<div class="advice"><p style="font-size:15px">Registrar é informação para cuidar.</p></div>`}<button class="primary" data-action="save-record">${tab==='drinks'?'Continuar':'Salvar registro'}</button></div></section>`}
function caminho(){nav('caminho');V.innerHTML=`<section class="screen"><a class="back" href="#inicio">← voltar ao início</a><div class="card"><p class="eyebrow">MEU CAMINHO</p><h2>O que você já está construindo.</h2><p>Progresso não é uma linha reta. É a soma das vezes em que você escolheu cuidar de si.</p><div class="metric-grid"><div class="metric"><b>${days()}</b><small>dias no caminho</small></div><div class="metric"><b>R$ 1.260</b><small>economizados</small></div><div class="metric"><b>${d.records.length}</b><small>registros</small></div></div><p style="font-size:11px;margin-bottom:6px">Seu ritmo nesta semana</p><div class="bar"><b></b></div></div><div class="section-head"><h2>Histórico recente</h2><a href="#registrar">registrar →</a></div><div class="history">${(d.records.length?d.records.slice(-4).reverse().map(r=>`<div class="history-row"><span><strong>${r.label}</strong><small>${r.when}</small></span><b>›</b></div>`).join(''):`<div class="history-row"><span><strong>Hoje · sem consumo registrado</strong><small>Seu primeiro registro pode ser agora.</small></span><b>✓</b></div>`)}</div></section>`}
function checkin(){nav('registrar');V.innerHTML=`<section class="screen"><a class="back" href="#inicio">← voltar ao início</a><div class="card"><p class="eyebrow">CHECK-IN DIÁRIO</p><h2>Como você está agora?</h2><p>Escolha uma palavra para começar.</p><div class="mood">${moods.map((m,i)=>`<button class="${d.mood===i?'selected':''}" data-mood="${i}">${m[0]}<small>${m[1]}</small></button>`).join('')}</div><button class="primary" data-action="save-mood">Salvar meu check-in</button></div></section>`}
function apoio(){nav('apoio');V.innerHTML=`<section class="screen"><a class="back" href="#inicio">← voltar ao início</a><div class="card"><p class="eyebrow">APOIO AGORA</p><h2>Uma coisa por vez.</h2><p>Use um recurso quando precisar de companhia para o próximo minuto.</p><div class="quick"><button class="q1" data-go="fissura"><strong>Plano de fissura</strong><small>Nomeie, mude o corpo e acione alguém.</small></button><button class="q2" data-go="checkin"><strong>Check-in</strong><small>Perceba sem julgamento.</small></button></div></div><div class="safety"><b>!</b><span>SAMU <strong>192</strong> · CVV <strong>188</strong></span></div></section>`}
function fissura(){nav('inicio');V.innerHTML=`<section class="screen"><a class="back" href="#inicio">← voltar ao início</a><div class="card"><p class="eyebrow">PLANO DE 3 MINUTOS</p><h2>Você não precisa decidir tudo agora.</h2><div class="history"><div class="history-row"><span><strong>1 · Nomeie</strong><small>“Estou sentindo vontade de usar.”</small></span><b>✓</b></div><div class="history-row"><span><strong>2 · Mude o corpo</strong><small>Água, rosto lavado, respiração lenta.</small></span><b>✓</b></div><div class="history-row"><span><strong>3 · Acione alguém</strong><small>“Pode ficar comigo por 15 minutos?”</small></span><b>✓</b></div></div><button class="primary" data-action="done">Atravessei estes 3 minutos</button></div></section>`}
function render(){const p=location.hash.slice(1)||'inicio';if(p==='inicio')home();else if(p==='registrar')register();else if(p==='caminho')caminho();else if(p==='checkin')checkin();else if(p==='apoio')apoio();else if(p==='fissura')fissura();else home()}document.addEventListener('click',e=>{const go=e.target.closest('[data-go]')?.dataset.go;if(go){location.hash=go;return}const t=e.target.closest('[data-tab]')?.dataset.tab;if(t){tab=t;chosen=null;register();return}const o=e.target.closest('[data-opt]');if(o){chosen=Number(o.dataset.opt);register();return}const q=e.target.closest('[data-qty]')?.dataset.qty;if(q){qty=Math.max(1,qty+(q==='+'?1:-1));register();return}const m=e.target.closest('[data-mood]');if(m){d.mood=Number(m.dataset.mood);save();checkin();return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='save-record'){if(chosen===null){toast('Escolha uma opção para registrar.');return}const label=(tab==='drinks'?drinks:drugs)[chosen][1];d.records.push({label,when:'Hoje · registro salvo'});save();toast('Registro salvo com cuidado.');setTimeout(()=>location.hash='caminho',400)}if(a==='save-mood'){toast('Check-in salvo. Obrigado por se ouvir.');setTimeout(()=>location.hash='inicio',400)}if(a==='done'){toast('Você atravessou este momento.');setTimeout(()=>location.hash='inicio',400)}if(a==='privacy'){toast('Seus dados ficam neste aparelho.')}});window.addEventListener('hashchange',render);render();
</script></body></html>
